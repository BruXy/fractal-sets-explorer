/**
 * Recalculates the XMin based on YMin, YMax, canvas height, canvas width, and center X coordinate.
 * This ensures the fractal display is correctly scaled and centered.
 * @param {object} set - The configuration object for the fractal set (either Mandelbrot or Julia).
 */
function recalculateSize(set) {
	set.Delta = (set.YMax - set.YMin) / appSettings.H; // Calculate pixel size
	// Adjust XMin to keep the fractal centered horizontally
	set.XMin = (-1) *  ((appSettings.W/2.0) * set.Delta) / 2.0 + set.CenterX;
	console.log(set); // For debugging
}

/**
 * Sets the color of a single pixel on the canvas.
 * @param {ImageData} canvasData - The ImageData object of the canvas.
 * @param {number} x - The x-coordinate of the pixel.
 * @param {number} y - The y-coordinate of the pixel.
 * @param {number} r - The red component of the color (0-255).
 * @param {number} g - The green component of the color (0-255).
 * @param {number} b - The blue component of the color (0-255).
 * @param {number} a - The alpha component of the color (0-255).
 */
function putPixel(canvasData, x, y, r, g, b, a) {
	const index = (x + y * appSettings.W) * 4; // Calculate the pixel's index in the ImageData array

    canvasData.data[index + 0] = r;
    canvasData.data[index + 1] = g;
    canvasData.data[index + 2] = b;
    canvasData.data[index + 3] = a; // Alpha: 0 = invisible, 255 = fully opaque
}

/**
 * Updates the entire canvas with the new pixel data.
 * @param {CanvasRenderingContext2D} canvasContext - The 2D rendering context of the canvas.
 * @param {ImageData} canvasData - The ImageData object containing the new pixel data.
 */
function updateCanvas(canvasContext,canvasData) {
    canvasContext.putImageData(canvasData, 0, 0);
}

/**
 * Renders the Mandelbrot set on the Mandelbrot canvas.
 * Iterates through each pixel, calculates its color based on the Mandelbrot algorithm,
 * and then draws the pixel.
 */
function mandelbrot() {
	let zoom = 1; // TODO: This variable is declared but not used. Remove or implement.
	let c_imag, c_real, Z_imag, Z_real, Z2_imag, Z2_real; // Variables for Mandelbrot calculation
	recalculateSize(mandelbrotScope.currentConfig); // Adjust fractal parameters based on current config
	const delta = mandelbrotScope.currentConfig.Delta; // Pixel size

 	let ctxData = mandelbrotContext.getImageData(0, 0, appSettings.W, appSettings.H); // Get image data to manipulate pixels

	c_imag = mandelbrotScope.currentConfig.YMax; // Start from the top (max imaginary value)
	// Loop through each row (y-coordinate)
	for ( let row = 0 ; row < appSettings.H ; row++ ) { 
	c_real = mandelbrotScope.currentConfig.XMin; // Start from the left (min real value)
	// Loop through each column (x-coordinate) for the Mandelbrot half of the screen
	for ( let col = 0 ; col < appSettings.W/2 ; col++ ) {
		let color = 0; // Iteration count, determines color
		Z_real = 0.0;  // Z_n real part
		Z_imag = 0.0;  // Z_n imaginary part
		// Mandelbrot iteration: Z_{n+1} = Z_n^2 + c
		do {
			/* Z_{n+1} = Z_n^2 + c */
			/* (A + Bi)^2 = A^2 + 2*A*Bi - B^2 */
			Z2_real = Z_real * Z_real; // Z_n real part squared
			Z2_imag = Z_imag * Z_imag; // Z_n imaginary part squared
			// New Z_n imaginary part: 2 * Re(Z_n) * Im(Z_n) + Im(c)
			Z_imag = 2.0 * Z_imag * Z_real + c_imag;
			// New Z_n real part: Re(Z_n)^2 - Im(Z_n)^2 + Re(c)
			Z_real = Z2_real - Z2_imag + c_real;	
			color++; // Increment iteration count
		// Continue if max iterations not reached and point is bounded (magnitude squared < 4)
		} while (color < appSettings.maxIterations && (Z2_real + Z2_imag) < 4.0);
	 
		// Color the pixel based on how quickly it escaped (or if it didn't)
		const pixelColor = calculatePixelColor(color, appSettings.maxIterations); // Use new helper
		putPixel(ctxData, col, row, pixelColor.r, pixelColor.g, pixelColor.b, pixelColor.a);
		
		c_real += delta; // Move to the next real value
	}
	c_imag -= delta; // Move to the next imaginary value (down one row)
	}
	updateCanvas(mandelbrotContext,ctxData); // Draw the completed image data to the canvas
}

/**
 * Calculates the color of a pixel based on the number of iterations.
 * @param {number} currentIteration - The number of iterations reached for the pixel.
 * @param {number} maxIterations - The maximum number of iterations.
 * @returns {{r: number, g: number, b: number, a: number}} The RGBA color object.
 */
function calculatePixelColor(currentIteration, maxIterations) {
	if (currentIteration < maxIterations) { // Point escaped
		// Color is based on how quickly the point escaped. Using modulo for cycling colors.
		return { r: currentIteration % 256, g: (4 * currentIteration) % 256, b: (20 + currentIteration) % 256, a: 255 };
	} else { // Point is likely in the set (did not escape within maxIterations)
		return { r: 0, g: 0, b: 0, a: 255 }; // Black for points in the set
	}
}

/**
 * Renders the Julia set on the Julia canvas.
 * Uses a seed point (c_real_seed, c_imag_seed) to define the specific Julia set.
 * @param {number} c_real_seed - The real part of the constant 'c' for the Julia set calculation.
 * @param {number} c_imag_seed - The imaginary part of the constant 'c' for the Julia set calculation.
 */
function julia(c_real_seed, c_imag_seed) { 
/* http://en.wikipedia.org/wiki/Julia_Set */
/* 'c' is the constant seed point for the Julia set, typically chosen from the Mandelbrot set. */
	let iterationCount = 0; // Renamed 'color' to 'iterationCount' for clarity.
	let x_coord, y_coord; // Renamed 'x,y' to 'x_coord, y_coord' for clarity. Represents the initial Z value for each pixel.
	let Z_imag, Z_real, Z2_imag, Z2_real; // Variables for the Julia iteration calculation.
	recalculateSize(juliaScope.currentConfig); // Adjust fractal display parameters based on current config.
    const delta = juliaScope.currentConfig.Delta; // The size of one pixel in complex plane coordinates.

    let jtxData = juliaContext.getImageData(0, 0, appSettings.W, appSettings.H); // Get ImageData object for direct pixel manipulation.
	
	/* Julia set computation: Iterate through each pixel on the canvas */
	y_coord = juliaScope.currentConfig.YMax; // Start from the top (maximum imaginary value).
	// Loop through each row (y-coordinate).
	for(let row = 0; row < appSettings.H; row++){
		x_coord = juliaScope.currentConfig.XMin; // Start from the left (minimum real value).
		// Loop through each column (x-coordinate) for the Julia canvas (left half of the screen).
		for(let col = 0; col < appSettings.W/2; col++){
			iterationCount = 0; // Reset iteration count for each new pixel.
			Z_real = x_coord; /* Z_0 real part: current pixel's x-coordinate in the complex plane. */
			Z_imag = y_coord; /* Z_0 imaginary part: current pixel's y-coordinate in the complex plane. */
			
			/* Iteration: Z_{n+1} = Z_n^2 + c */
			// 'c' is (c_real_seed, c_imag_seed)
			do {
				Z2_real = Z_real * Z_real; // Real part of Z_n squared.
				Z2_imag = Z_imag * Z_imag; // Imaginary part of Z_n squared.
				// New Z_n imaginary part: 2 * Re(Z_n) * Im(Z_n) + Im(c)
				Z_imag = 2.0 * Z_imag * Z_real + c_imag_seed; 
				// New Z_n real part: Re(Z_n)^2 - Im(Z_n)^2 + Re(c)
				Z_real = Z2_real - Z2_imag + c_real_seed; 
				iterationCount++; // Increment iteration count.
			// Continue if max iterations not reached AND the point is still bounded (magnitude squared < 4.0).
			} while(iterationCount < appSettings.maxIterations && (Z2_real + Z2_imag) < 4.0);

			/* Plot pixel: Determine color based on iterationCount */
			const pixelColor = calculatePixelColor(iterationCount, appSettings.maxIterations); // Use new helper
			putPixel(jtxData, col, row, pixelColor.r, pixelColor.g, pixelColor.b, pixelColor.a);

			x_coord += delta; // Move to the next real value (pixel to the right).
		}
		y_coord -= delta; // Move to the next imaginary value (pixel row downwards).
	}		

	updateCanvas(juliaContext,jtxData); // Draw the completed Julia set image data to the canvas.
}

/**
 * Converts screen pixel coordinates to complex plane coordinates.
 * @param {number} x - The screen x-coordinate.
 * @param {number} y - The screen y-coordinate.
 * @param {object} dataSet - The configuration object for the fractal set (Mandelbrot or Julia).
 * @returns {{dx: number, dy: number}} The corresponding complex plane coordinates.
 */
function screen_xy_to_real(x, y, dataSet) {
	// dx = XMin + (pixel size * screen x-coordinate)
	const dx = dataSet.XMin + (dataSet.Delta * x);
	// dy = YMin + (pixel size * (canvas height - screen y-coordinate))
	// (H-y) because screen y is top-to-bottom, fractal y is bottom-to-top
	const dy = dataSet.YMin + (dataSet.Delta *(appSettings.H-y));
	console.log("c = " + dx + " + " + dy + "i"); // Debugging
	return { dx, dy };
}

/**
 * Formats the Julia seed coordinates (complex number) for display.
 * @param {number} dx - The real part of the Julia seed.
 * @param {number} dy - The imaginary part of the Julia seed.
 * @param {number} digits - The number of decimal places to display.
 * @returns {string} The formatted string representation of the Julia seed.
 */
function formatJuliaSeed(dx, dy, digits) {
	const imag = "<span style='font-style: normal;'>i</span>"; // HTML for the imaginary unit 'i'
	
	/**
	 * Formats a number to a string with a fixed number of decimal places.
	 * Handles absolute value for consistent formatting before adding sign.
	 * @param {number} a - The number to format.
	 * @returns {string} The formatted number string.
	 */
	function formatNumber(a) { // float to string conversion
		const mult   = Math.pow(10, digits);
		return parseFloat(Math.round(Math.abs(a)*mult)/mult).toFixed(digits); 
	}

	let dxString = formatNumber(dx); 
	let dyString = formatNumber(dy);

	// Add minus sign if negative
	if(dx < 0) { // add prefix 'MINUS SIGN' (U+2212)
		dxString = "\u2212" + dxString;   
	}

	if(dy < 0) {
		dyString = "\u2212 " + dyString;	// Minus sign for imaginary part
	}
	else {
		dyString = "+ " + dyString; // Plus sign for positive imaginary part
	}

    // imaginery unit separated by U+2009 'THIN SPACE'
	return "c = " + dxString + " " + dyString + "\u2009" + imag;	
}

/**
 * Handles mouse wheel events for zooming in and out of fractals.
 * Determines which fractal (Mandelbrot or Julia) the mouse is over and applies zoom.
 * @param {WheelEvent} event - The wheel event object.
 */
function applyZoom(dataSetConfiguration, wheelScrollDelta, complexPlaneMousePosition) {
	const { dx, dy } = complexPlaneMousePosition; // dx, dy are the real and imaginary parts of mouse position in the complex plane.
	dataSetConfiguration.CenterX = dx; // Center the new view on the mouse's complex coordinates.
	dataSetConfiguration.CenterY = dy;

	if (wheelScrollDelta < -1) { // Zoom in (typically wheel scroll up, negative delta value)
		// Reduce the viewable range in the complex plane, effectively zooming in.
		// The divisors (e.g., appSettings.H / 4, appSettings.W / 8) control the "speed" or "strength" of the zoom.
		// A smaller divisor means a smaller viewable range, thus a stronger zoom.
		dataSetConfiguration.YMin = dy - (appSettings.H / 4) * dataSetConfiguration.Delta;
		dataSetConfiguration.YMax = dy + (appSettings.H / 4) * dataSetConfiguration.Delta;
		// For XMin, W/8 is used because each fractal's canvas is W/2 wide.
		// This attempts to maintain a somewhat proportional zoom relative to the canvas dimensions.
		dataSetConfiguration.XMin = dx - (appSettings.W / 8) * dataSetConfiguration.Delta; 
		appSettings.cDigits += 1; // Increase the number of decimal places for coordinate display.
	} else { // Zoom out (typically wheel scroll down, positive delta value)
		// Increase the viewable range in the complex plane, effectively zooming out.
		dataSetConfiguration.YMin = dy - (appSettings.H) * dataSetConfiguration.Delta; // Larger multiplier for Y-range
		dataSetConfiguration.YMax = dy + (appSettings.H) * dataSetConfiguration.Delta; // Larger multiplier for Y-range
		dataSetConfiguration.XMin = dx - (appSettings.W / 2) * dataSetConfiguration.Delta; // Larger multiplier for X-range
		appSettings.cDigits -= 1; // Decrease the number of decimal places for coordinate display.
		if (appSettings.cDigits < 0) appSettings.cDigits = 0; // Prevent negative digit count.
	}
}

/**
 * Handles mouse wheel events for zooming in and out of fractals.
 * Determines which fractal (Mandelbrot or Julia) the mouse is over and applies zoom.
 * @param {WheelEvent} event - The wheel event object.
 */
function zoomWheel(event) { 
	const viewportMouseX = event.clientX; // Mouse x-coordinate relative to the viewport.
	const viewportMouseY = event.clientY; // Mouse y-coordinate relative to the viewport.
    const wheelScrollDelta = event.deltaY; // Indicates scroll direction and magnitude. Negative for zoom in, positive for zoom out.
	const elementUnderMouse = document.elementFromPoint(viewportMouseX, viewportMouseY); // The DOM element currently under the mouse cursor.
	
	let targetCanvasBoundingRect; // Will store the bounding rectangle of the canvas being zoomed.
	let targetFractalConfig;  // Will store the configuration object (Mandelbrot or Julia) for the target canvas.

	// Determine if the mouse is over the Mandelbrot or Julia canvas and set the appropriate context.
	if ( elementUnderMouse === mandelbrotCanvas ) {
		 targetCanvasBoundingRect = mandelbrotCanvas.getBoundingClientRect(); 
		 targetFractalConfig  = mandelbrotScope.currentConfig;
	 }
	else if ( elementUnderMouse === juliaCanvas ) { 
		targetCanvasBoundingRect = juliaCanvas.getBoundingClientRect();
		targetFractalConfig  = juliaScope.currentConfig;
	}

	// If the mouse is not over a recognized canvas, or if its configuration is missing, do nothing.
	if (!targetCanvasBoundingRect || !targetFractalConfig) return; 

	// Adjust mouse coordinates to be relative to the hovered canvas (rather than the viewport).
	const xRelativeToCanvas = viewportMouseX - targetCanvasBoundingRect.left;
	const yRelativeToCanvas = viewportMouseY - targetCanvasBoundingRect.top;  

	// Convert the canvas-relative mouse position to complex plane coordinates.
	const complexPlaneMousePosition = screen_xy_to_real(xRelativeToCanvas, yRelativeToCanvas, targetFractalConfig);

	// Apply the zoom logic using the determined parameters.
	applyZoom(targetFractalConfig, wheelScrollDelta, complexPlaneMousePosition);
	
	// Debugging log:
	const zoomType = wheelScrollDelta < -1 ? "in" : "out";
	const fractalName = elementUnderMouse === mandelbrotCanvas ? "Mandelbrot" : "Julia";
	console.log(`Zoom ${zoomType} on ${fractalName} at screen:(${xRelativeToCanvas.toFixed(2)}, ${yRelativeToCanvas.toFixed(2)}), complex:(${complexPlaneMousePosition.dx.toFixed(appSettings.cDigits)}, ${complexPlaneMousePosition.dy.toFixed(appSettings.cDigits)}i)`);

	// Redraw the appropriate fractal after zoom.
	if ( targetFractalConfig === mandelbrotScope.currentConfig ) mandelbrot(); 
	else if ( targetFractalConfig === juliaScope.currentConfig ) julia(JuliaSeed.x,JuliaSeed.y); 
}
